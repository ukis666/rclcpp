name: Focused validation issue 2488

on:
  pull_request:
    branches:
      - ci/validate-2488-base

jobs:
  focused-clang-test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-rolling-ros-base-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y clang
          source /opt/ros/rolling/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update
          rosdep install --from-paths rclcpp --ignore-src --rosdistro rolling -r -y
      - name: Configure and build test_utilities with Clang
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          colcon build \
            --packages-select rclcpp \
            --cmake-target test_utilities \
            --event-handlers console_direct+ \
            --cmake-args \
              -DBUILD_TESTING=ON \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              '-DCMAKE_CXX_FLAGS=-Werror=ordered-compare-function-pointers'
      - name: Run test_utilities through CTest
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          ctest --test-dir build/rclcpp -R '^test_utilities$' --output-on-failure
